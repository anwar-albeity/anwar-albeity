<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'">
  <meta name="robots" content="noindex">
  <title>Not found · Anwar Albeity</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    @font-face { font-family: 'Fraunces'; src: url(/fraunces-latin-full-normal.woff2) format('woff2'); font-weight: 100 900; font-display: swap; }
    html, body { margin: 0; height: 100%; }
    body { display: grid; place-items: center; background: #fff; color: #111; font: 500 18px/1.4 Fraunces, Georgia, serif; padding: 24px; box-sizing: border-box; }
    main { max-width: 560px; width: 100%; }
    .blob { width: 120px; height: 150px; background: #e6e6e6; border-radius: 47% 53% 44% 56% / 52% 45% 55% 48%; margin-bottom: 28px; animation: b 7s ease-in-out infinite; }
    @keyframes b { 50% { border-radius: 54% 46% 52% 48% / 46% 55% 45% 54%; transform: rotate(3deg); } }
    @media (prefers-reduced-motion: reduce) { .blob { animation: none; } }
    h1 { font: inherit; font-weight: 650; margin: 0; }
    hr { border: 0; border-top: 1px solid #111; margin: 10px 0; }
    p { margin: 0; color: rgba(17, 17, 17, .55); }
    a { color: #111; text-underline-offset: .18em; }
  </style>
</head>
<body>
  <main>
    <div class="blob" aria-hidden="true"></div>
    <h1>This island isn’t on the map.</h1><hr>
    <p>The page you were looking for has drifted off. <a href="/">Back to the islands →</a></p><hr>
  </main>
</body>
</html>
